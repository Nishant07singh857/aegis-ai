# backend/tests/pytest.ini
[pytest]
# Pytest configuration for AEGIS AI test suite

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires database, redis)
    e2e: End-to-end tests (requires full system)
    slow: Slow tests (take > 1 second)
    vision: Vision pipeline tests
    agents: Agent system tests
    ml: Machine learning tests
    api: API endpoint tests
    broadcast: Broadcast/OBS tests
    websocket: WebSocket tests
    database: Database/repository tests
    services: Service-layer tests
    utils: Utility tests

# Output
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider
    --cov=app
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-fail-under=70

# Coverage
cov_branch = true
cov_source = app

# Timeouts
timeout = 60
timeout_method = signal

# Logging
log_cli = false
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:.*pkg_resources.*
    ignore::RuntimeWarning:.*coroutine.*was never awaited

# Environment
env =
    ENVIRONMENT=testing
    DEBUG=true
    DATABASE_URL=sqlite+aiosqlite:///./test.db
    REDIS_URL=redis://localhost:6379/15
    SECRET_KEY=test-secret-key-for-testing-only