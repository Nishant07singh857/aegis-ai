[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "aegis-ai-backend"
version = "1.0.0"
description = "AEGIS AI - Autonomous Esports Operating System for BGMI"
authors = ["AEGIS AI Team"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"

# ── Web Framework ──────────────────────────────────────────────────
fastapi = "^0.115.0"
uvicorn = { version = "^0.34.0", extras = ["standard"] }
orjson = "^3.10.0"
python-multipart = "^0.0.20"

# ── Database ───────────────────────────────────────────────────────
sqlalchemy = { version = "^2.0.36", extras = ["asyncio"] }
asyncpg = "^0.30.0"
alembic = "^1.14.0"
psycopg2-binary = "^2.9.10"

# ── Redis / Event Bus ──────────────────────────────────────────────
redis = { version = "^5.2.0", extras = ["hiredis"] }

# ── Configuration / Validation ─────────────────────────────────────
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"

# ── AI / ML ────────────────────────────────────────────────────────
torch = { version = "^2.5.0", optional = true }
torchvision = { version = "^0.20.0", optional = true }
numpy = "^1.26.0"
opencv-python-headless = "^4.10.0"
ultralytics = { version = "^8.3.0", optional = true }
paddlepaddle = { version = "^2.6.0", optional = true }
paddleocr = { version = "^2.8.0", optional = true }

# ── LLM / Commentary ───────────────────────────────────────────────
openai = "^1.56.0"
httpx = "^0.28.0"
TTS = "^0.22.0"
pydub = "^0.25.1"

# ── Security ───────────────────────────────────────────────────────
pyjwt = "^2.10.0"
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
cryptography = "^43.0.0"
bcrypt = "^4.2.0"

# ── Logging / Monitoring ───────────────────────────────────────────
structlog = "^24.4.0"
python-json-logger = "^3.2.0"
psutil = "^6.1.0"

# ── OBS WebSocket ──────────────────────────────────────────────────
obsws-python = "^1.7.0"
websockets = "^14.0"

# ── Screen capture (free, MIT) ─────────────────────────────────────────
mss = "^10.1.0"

# ── Utilities ──────────────────────────────────────────────────────
fpdf2 = "^2.8.0"
aiofiles = "^24.1.0"
aiohttp = "^3.11.0"
python-dotenv = "^1.0.0"
pydantic-extra-types = "^2.10.0"
tenacity = "^9.0.0"
rich = "^13.9.0"
click = "^8.1.8"
humanize = "^4.11.0"

[tool.poetry.extras]
ml = ["torch", "torchvision", "ultralytics", "paddlepaddle", "paddleocr", "onnxruntime", "opencv-python-headless"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
black = "^24.10.0"
isort = "^5.13.0"
ruff = "^0.8.0"
mypy = "^1.13.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
